<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="join">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">ح</span>
        حَصاد التعليمية
      </a>
      <nav class="nav">
        <a href="index.html">الرئيسية</a>
        <a href="teacher.html">لوحة المعلم</a>
        <a href="join.html">دخول الطالب</a>
      </nav>
    </div>
  </header>
  <main class="page-wrap">
    <div class="container">
      <form id="join-form" class="panel join-box">
        <div class="eyebrow" style="margin-inline:auto">دخول الطالب</div>
        <h2 style="margin-top:12px">أدخل رمز الحصة</h2>
        <p class="hint">الرمز يُعطى لك من معلمك. بعده تشاهد حصص المادة الأسبوعية داخل الموقع.</p>
        <div class="field" style="text-align:right;margin:18px 0">
          <label for="code-input">رمز الدخول</label>
          <input id="code-input" required maxlength="16" placeholder="مثال: RYD6K2M" autocomplete="off" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">دخول إلى المادة</button>
        <p class="meta" style="margin-top:16px">للتجربة: RYD6K2M أو ARB5N8Q أو ISL4P7T</p>
      </form>
    </div>
  </main>
  <footer>
    <div class="container">حَصاد التعليمية · دخول الطالب بالرمز</div>
  </footer>
  <div class="toast"></div>
  <script src="js/app.js"></script>
